<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121218" />
      <stop offset="100%" stop-color="#1a101e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="950" cy="150" r="280" fill="#E50914" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="550" r="320" fill="#6E0DF2" opacity="0.08" filter="url(#glow)" />

  <!-- App Window Frame -->
  <rect x="60" y="45" width="1080" height="585" rx="16" fill="#141419" stroke="#2a2a35" stroke-width="2" />

  <!-- Top Nav -->
  <rect x="60" y="45" width="1080" height="70" rx="16" fill="#181820" />
  <text x="110" y="88" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="24" letter-spacing="1">CINE<tspan fill="#E50914">MATCH</tspan></text>
  
  <!-- Nav Pills -->
  <rect x="340" y="68" width="80" height="26" rx="13" fill="#E50914" />
  <text x="380" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="13" text-anchor="middle">For You</text>
  <text x="470" y="85" fill="#8E8E9A" font-family="'Inter', sans-serif" font-weight="500" font-size="13" text-anchor="middle">Discover</text>
  <text x="560" y="85" fill="#8E8E9A" font-family="'Inter', sans-serif" font-weight="500" font-size="13" text-anchor="middle">Watchlist</text>

  <!-- Search bar -->
  <rect x="760" y="65" width="280" height="32" rx="16" fill="#0E0E12" stroke="#2C2C38" stroke-width="1.5" />
  <text x="795" y="86" fill="#606070" font-family="'Inter', sans-serif" font-size="13">Search movies…</text>

  <!-- Hero Feature Card -->
  <rect x="110" y="150" width="980" height="230" rx="14" fill="#1C1C26" stroke="#2E2E3C" stroke-width="1.5" />
  <!-- Hero badge -->
  <rect x="150" y="185" width="250" height="28" rx="6" fill="#E50914" fill-opacity="0.15" stroke="#E50914" stroke-width="1" />
  <text x="275" y="204" fill="#FF5252" font-family="'Inter', sans-serif" font-weight="600" font-size="13" text-anchor="middle">BECAUSE YOU RATED INCEPTION 5★</text>
  
  <text x="150" y="255" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="38">Interstellar</text>
  <text x="150" y="290" fill="#A0A0B0" font-family="'Inter', sans-serif" font-weight="500" font-size="16">2014 · 98% Match · Sci-Fi, Drama, Adventure</text>
  
  <!-- Buttons -->
  <rect x="150" y="315" width="140" height="38" rx="8" fill="#E50914" />
  <text x="220" y="339" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="14" text-anchor="middle">★ Rate this</text>
  
  <rect x="305" y="315" width="140" height="38" rx="8" fill="#292938" stroke="#3D3D50" stroke-width="1" />
  <text x="375" y="339" fill="#E0E0F0" font-family="'Inter', sans-serif" font-weight="600" font-size="14" text-anchor="middle">＋ Watchlist</text>

  <!-- Recommendation Cards Row -->
  <text x="110" y="425" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Top Picks For You</text>

  <!-- Card 1 -->
  <rect x="110" y="445" width="310" height="150" rx="12" fill="#181822" stroke="#282836" stroke-width="1.5" />
  <text x="135" y="485" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="18">The Dark Knight</text>
  <text x="135" y="515" fill="#4CD964" font-family="'Inter', sans-serif" font-weight="600" font-size="14">96% Match</text>
  <text x="215" y="515" fill="#888898" font-family="'Inter', sans-serif" font-size="14">· 2008 · Action</text>
  <text x="135" y="560" fill="#9999AA" font-family="'Inter', sans-serif" font-size="13">Because you liked The Prestige</text>

  <!-- Card 2 -->
  <rect x="445" y="445" width="310" height="150" rx="12" fill="#181822" stroke="#282836" stroke-width="1.5" />
  <text x="470" y="485" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="18">Blade Runner 2049</text>
  <text x="470" y="515" fill="#4CD964" font-family="'Inter', sans-serif" font-weight="600" font-size="14">94% Match</text>
  <text x="550" y="515" fill="#888898" font-family="'Inter', sans-serif" font-size="14">· 2017 · Sci-Fi</text>
  <text x="470" y="560" fill="#9999AA" font-family="'Inter', sans-serif" font-size="13">Because you liked Ex Machina</text>

  <!-- Card 3 -->
  <rect x="780" y="445" width="310" height="150" rx="12" fill="#181822" stroke="#282836" stroke-width="1.5" />
  <text x="805" y="485" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="18">Arrival</text>
  <text x="805" y="515" fill="#4CD964" font-family="'Inter', sans-serif" font-weight="600" font-size="14">92% Match</text>
  <text x="885" y="515" fill="#888898" font-family="'Inter', sans-serif" font-size="14">· 2016 · Mystery</text>
  <text x="805" y="560" fill="#9999AA" font-family="'Inter', sans-serif" font-size="13">Because you liked Interstellar</text>
</svg>
